site_name: SPRING Lab Documentation
repo_name: SPRING Lab
repo_url: https://github.com/spring-iitd/

plugins:
  - search
  - meta

theme:
  name: material
  custom_dir: overrides
  favicon: ./imgs/logo-circle.png
  logo: ./imgs/logo-circle.png
  icon:
    repo: fontawesome/brands/github
  palette:

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra:
  homepage: https://spring.iitd.ac.in

nav:
    - About: "index.md"
    - 'Proxy Login':
        - 'Setting up Proxy': "proxy_setup.md"
        - 'Log In to the Proxy': "internet_on_vm.md"
        - 'Internet on Terminal': "internet_on_my_terminal.md"
    - 'Working Remotely':
        - "Using SSH": "ssh_session.md"
        - "Using VNC": "vnc_setup.md"
    - 'Using HPC': 'using_hpc.md'
    - 'Setting up ML Environments':
        - 'Using Poweredge Server': "server_setup.md"
        - 'Using Conda': 'using_conda.md'
    - 'Setting up New Machines':
        - 'Package Installation (APT)' : "package_installation.md"
        - 'WiFi on Raspberry Pi': "wifi_on_raspberry_pi.md"
    - 'Working with Docker':
        - 'Installing Docker': "docker_install.md"
        - 'Proxy Configuration for Docker': "docker_proxy_settings.md"
    - 'Configuring Git/Github': "git_errors.md"
    - 'Making Presentations': "making_presentations.md"
    - 'Printer Setup': "printer.md"
    - 'FAQs': "faqs.md"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences